*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#ff0000;--bg:#f4f3f0;--surface:#fff;--surface-2:#f0eeeb;
  --border:rgba(0,0,0,.09);--text:#000;--text-2:#666;--text-3:#999;
  --green:#1a6b38;--green-bg:#e6f4ec;--loss:#c0392b;--loss-bg:#fdecea;
  --r:8px;--rl:12px;--font:'DINRound',Arial,sans-serif
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{background:var(--red);padding:0 32px;height:58px;display:flex;align-items:center;justify-content:space-between}
.topbar-name{color:#fff;font-size:19px;font-weight:500;letter-spacing:.02em}
.topbar-sub{color:rgba(255,255,255,.75);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-text,.topbar-date{color:rgba(255,255,255,.85);font-size:11px}
.topbar-date{margin-left:14px}
.container{max-width:1160px;margin:0 auto;padding:24px 24px 40px}
.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.tab{padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);white-space:nowrap;transition:all .15s;font-family:var(--font)}
.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.tab:hover:not(.active){border-color:var(--red);color:var(--red)}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:18px 20px}
.card-label{font-size:10px;font-weight:500;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card-label-note{font-size:9px;color:var(--text-3);font-weight:400;font-style:italic;text-transform:none;letter-spacing:0}

/* P&L */
.calc-card{background:var(--surface);border:2px solid var(--red);border-radius:var(--rl);padding:18px 20px;margin-bottom:14px}
.calc-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calc-icon{width:34px;height:34px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:500;flex-shrink:0}
.calc-title{font-size:13px;font-weight:500}.calc-sub{font-size:11px;color:var(--text-2);margin-top:1px}
.calc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.calc-field label{display:block;font-size:10px;font-weight:500;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.calc-field input{width:100%;padding:9px 11px;font-size:13px;font-family:monospace;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);color:var(--text);outline:none;transition:border-color .15s}
.calc-field input:focus{border-color:var(--red)}
.calc-hint{font-size:10px;color:var(--text-3);margin-top:3px}
.calc-divider{border:none;border-top:1px solid var(--border);margin:12px 0}
/* 3 result cols — no "vs hoy mid" */
.calc-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.calc-result-item{background:var(--surface-2);border-radius:var(--r);padding:12px;text-align:center}
.calc-result-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.calc-result-value{font-size:18px;font-weight:500;font-family:monospace}
.pnl-pos{color:var(--green)}.pnl-neg{color:var(--loss)}.pnl-neu{color:var(--text)}
.calc-result-sub{font-size:10px;color:var(--text-3);margin-top:3px}
.today-ref{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-bottom:12px;flex-wrap:wrap}

/* Top row: Emisor + TradingView chart */
.top-row{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px}

/* Emisor card internals */
.issuer-logo-wrap{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:.5px solid var(--border);overflow:hidden;background:#fff;padding:4px}
.isin-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:var(--r);padding:9px 12px;margin-bottom:10px}
.isin-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.isin-code{font-size:12px;font-weight:500;font-family:monospace;letter-spacing:.03em}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.di{background:var(--surface-2);border-radius:6px;padding:16px 14px}
.dil{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.dv{font-size:12px;font-weight:500}
/* BID/ASK inline rows inside emisor card */
.ba-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:.5px solid var(--border);font-size:12px}
.ba-row:first-of-type{margin-top:4px}
.ind-badge{font-size:9px;background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:3px;font-weight:500}
.tv-badge{font-size:9px;background:#e8f0fe;color:#1a3a9c;padding:2px 7px;border-radius:3px;font-weight:500}

/* TradingView chart */
.tv-chart-wrap{width:100%;height:100%;min-height:340px;border-radius:var(--r);overflow:hidden;background:#fff}
.tv-pending{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:11px}
.tv-pending a{color:var(--red);font-size:11px;text-decoration:none}
.tv-pending a:hover{text-decoration:underline}

/* Risk — full width */
.risk-card{background:#fff8f8;border:.5px solid rgba(255,0,0,.15);border-radius:var(--rl);padding:14px 18px;margin-bottom:14px}
.risk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.risk-badge{background:var(--red);color:#fff;font-size:9px;font-weight:500;padding:2px 7px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase}
.risk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.risk-item{background:#fff;border:.5px solid rgba(255,0,0,.10);border-radius:var(--r);padding:18px 16px}
.risk-item-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.risk-item-value{font-size:14px;font-weight:500;font-family:monospace}
.risk-item-sub{font-size:10px;color:var(--text-3);margin-top:2px}
.out-neg{color:#c0392b;font-size:10px;margin-left:5px}.out-sta{color:#1a6b38;font-size:10px;margin-left:5px}
.rating-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.rp-aa{background:#e6f4ec;color:#1a6b38}.rp-a{background:#e8f0fe;color:#1a3a9c}.rp-bbb{background:#fef3c7;color:#92400e}.rp-bb{background:#fdecea;color:#c0392b}

/* News — full width */
.news-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:18px 20px;margin-bottom:14px}
.news-item{padding:9px 0;border-bottom:.5px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.news-src{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:3px;background:#e8f0fe;color:#1a3a9c;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-date{font-size:10px;color:var(--text-3)}
.news-title{font-size:12px;color:var(--text);line-height:1.45;margin-bottom:3px}
.news-link{font-size:11px;color:var(--red);text-decoration:none}
.news-link:hover{text-decoration:underline}
.news-skel{height:52px;background:var(--surface-2);border-radius:var(--r);animation:shimmer 1.4s infinite;margin-bottom:8px}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}
.news-empty{font-size:11px;color:var(--text-3);padding:8px 0}
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.footer{background:var(--red);padding:18px 32px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer-logo{color:#fff;font-size:14px;font-weight:500;letter-spacing:.02em}
.footer-text{color:rgba(255,255,255,.75);font-size:11px}
</style>
</head>

function modDuration(y,ytmPct,cpnPct,face){
  var y2=ytmPct/100/2,c2=cpnPct/100/2,n=Math.round(y*2);
  if(n<=0)return 0;if(y2===0)return y;
  var cf=c2*face,price=0,mac=0;
  for(var t=1;t<=n;t++)price+=cf/Math.pow(1+y2,t);
  price+=face/Math.pow(1+y2,n);
  for(var t=1;t<=n;t++)mac+=(t/2)*(cf/Math.pow(1+y2,t))/price;
  mac+=(n/2)*(face/Math.pow(1+y2,n))/price;
  return Math.round(mac/(1+y2)*100)/100;
}
function dv01(md,mid,face){return Math.round((md/100)*(mid/100)*face);}

window._calcPnL=function(){
  var b=bonds[activeIdx],s=STATIC[b.logoKey];
  var bid=s.bid,ask=s.ask;
  var buy=parseFloat((document.getElementById("inp-buy")||{}).value)||0;
  var sell=parseFloat((document.getElementById("inp-sell")||{}).value)||0;
  var qty=parseFloat((document.getElementById("inp-qty")||{}).value)||0;
  var mid=(bid+ask)/2,not=qty*b.face;
  var cost=(buy>0&&qty>0)?(buy/100)*not:null;
  var tgt=(sell>0&&qty>0)?(sell/100)*not:null;
  var pT=cost!==null&&tgt!==null?tgt-cost:null;
  var pPct=pT!==null&&cost!==0?(pT/cost)*100:null;
  function fm(v){if(v===null)return"\u2014";return(v>=0?"+$":"-$")+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:0});}
  function fa(v){if(v===null)return"\u2014";return"$"+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:0});}
  function cc(v){return v===null?"pnl-neu":v>0?"pnl-pos":v<0?"pnl-neg":"pnl-neu";}
  function se(id,val,cl){var e=document.getElementById(id);if(e){e.textContent=val;e.className="calc-result-value "+cl;}}
  se("res-cost",fa(cost),"pnl-neu");
  se("res-target",fa(tgt),"pnl-neu");
  se("res-pnl",fm(pT),cc(pT));
  var s2=document.getElementById("res-pnl-sub");
  if(s2)s2.textContent=pPct!==null?(pPct>=0?"+":"")+pPct.toFixed(2)+"%":"retorno esperado";
};

  var ck=b.newsSymbol||b.ticker;

  panel.innerHTML='<div class="news-skel"></div><div class="news-skel"></div><div class="news-skel"></div>';

    if(b.newsCategories)params+="&categories="+b.newsCategories;
  } else {
    params+="&search="+encodeURIComponent(b.newsSearch);
  }
  fetch(MKTBASE+"?"+params)

    .then(function(d){

function renderNews(items,panel){
  if(!items||!items.length){panel.innerHTML='<div class="news-empty">Sin noticias recientes.</div>';return;}
  var h="";
  items.forEach(function(item){
    var title=String(item.title||"").replace(/<[^>]+>/g,"");
    if(title.length>90)title=title.substring(0,90)+"\u2026";
    h+='<div class="news-item"><div class="news-meta"><span class="news-src">'+item.src+'</span><span class="news-date">'+fmtDate(item.pubDate)+'</span></div>';
    h+='<div class="news-title">'+title+'</div><a class="news-link" href="'+(item.link||"#")+'" target="_blank" rel="noopener">Ver noticia &#8594;</a></div>';
  });
  panel.innerHTML=h;
}

  h+='</div><div class="calc-divider"></div><div class="calc-results">';
  h+='<div class="calc-result-item"><div class="calc-result-label">Costo total</div><div class="calc-result-value pnl-neu" id="res-cost">\u2014</div><div class="calc-result-sub">a precio compra</div></div>';
  h+='<div class="calc-result-item"><div class="calc-result-label">Valor objetivo</div><div class="calc-result-value pnl-neu" id="res-target">\u2014</div><div class="calc-result-sub">a precio venta</div></div>';
  h+='<div class="calc-result-item"><div class="calc-result-label">P&amp;L vs objetivo</div><div class="calc-result-value pnl-neu" id="res-pnl">\u2014</div><div class="calc-result-sub" id="res-pnl-sub">retorno esperado</div></div>';
  h+='</div></div>';

  /* ── Top row: Emisor (con BID/ASK embebido) + TradingView ── */
  h+='<div class="top-row">';

  /* Emisor card con BID/ASK y métricas clave abajo */
  h+='<div class="card"><div class="card-label"><span>Emisor</span></div>';
  h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:13px"><div class="issuer-logo-wrap">'+logo+'</div>';
  h+='<div><div style="font-size:15px;font-weight:500">'+b.name+'</div>';
  h+='<div style="font-size:11px;color:var(--text-2);margin-top:2px;font-family:monospace">'+b.ticker+' \u00b7 '+b.type+'</div></div></div>';
  h+='<div class="isin-row"><div><div class="isin-label">ISIN</div><div class="isin-code">'+b.isin+'</div></div>';
  h+='<div style="text-align:right"><div class="isin-label">CUSIP</div><div class="isin-code">'+b.cusip+'</div></div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  h+='<div class="di"><div class="dil">Vencimiento</div><div class="dv" style="font-size:13px;margin-top:4px">'+b.maturityDisplay+'</div></div>';
  h+='<div class="di"><div class="dil">Cup\u00f3n</div><div class="dv" style="font-size:13px;margin-top:4px">'+b.coupon+'</div></div>';
  h+='<div class="di"><div class="dil">Moneda</div><div class="dv" style="font-size:13px;margin-top:4px">'+b.currency+'</div></div>';
  h+='<div class="di"><div class="dil">Cup\u00f3n anual</div><div class="dv" style="font-size:13px;margin-top:4px">$'+ann+'</div></div>';
  h+='</div>';
  h+='</div>';

  /* TradingView chart — ocupa 2/3 del ancho */
  h+='<div class="card" style="padding:14px"><div class="card-label"><span>Gr\u00e1fico de precio</span>';
  if(hasTv)h+='<span class="tv-badge">TradingView \u00b7 Tiempo real</span>';
  h+='</div>';
  if(hasTv){
    h+='<div class="tv-chart-wrap" id="tv-'+idx+'" style="height:340px"></div>';
  } else {
    h+='<div class="tv-pending"><span style="font-size:28px">\u23f3</span><span>Ticker TV pendiente</span><a href="'+b.priceUrl+'" target="_blank">Ver en Borse Frankfurt &#8599;</a></div>';
  }
  h+='</div>';
  h+='</div>'; /* end top-row */

  /* ── Bottom row: Riesgos + Noticias lado a lado ── */
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">';

  /* Análisis de Riesgos */
  h+='<div class="risk-card" style="margin-bottom:0"><div class="risk-header"><span style="font-size:12px;font-weight:500">An\u00e1lisis de Riesgos</span><span class="risk-badge">Risk Management</span></div>';
  h+='<div class="risk-grid">';
  h+='<div class="risk-item"><div class="risk-item-label">S&amp;P Rating</div><div class="risk-item-value"><span class="rating-pill '+rpCls(rt.sp)+'">'+rt.sp+'</span>'+spOut+'</div><div class="risk-item-sub">S&amp;P Global</div></div>';
  h+='<div class="risk-item"><div class="risk-item-label">Moodys Rating</div><div class="risk-item-value"><span class="rating-pill '+rpCls(rt.moodys)+'">'+rt.moodys+'</span>'+mdOut+'</div><div class="risk-item-sub">Moodys Investors Service</div></div>';
  h+='<div class="risk-item"><div class="risk-item-label">Duration modif.<span style="font-size:9px;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:3px;margin-left:5px;font-weight:400">Residual</span></div><div class="risk-item-value">'+md+' a\u00f1os</div><div class="risk-item-sub">Plazo residual: '+ryStr+' a\u00f1os</div></div>';
  h+='<div class="risk-item"><div class="risk-item-label">DV01</div><div class="risk-item-value">$'+dv+' / bp</div><div class="risk-item-sub">sensibilidad por bp</div></div>';
  h+='</div></div>';

  /* Noticias */
  h+='<div class="news-card" style="margin-bottom:0"><div class="card-label"><span>Noticias en vivo</span><span class="card-label-note">Marketaux</span></div>';
  h+='<div id="newsPanel-'+idx+'"><div class="news-skel"></div><div class="news-skel"></div><div class="news-skel"></div></div>';
  h+='</div>';

  h+='</div>'; /* end bottom row */

  return h;
}

function selectBond(idx){
  activeIdx=idx;
  document.querySelectorAll(".tab").forEach(function(t,i){t.classList.toggle("active",i===idx);});
  var b=bonds[idx];
  document.getElementById("bondContent").innerHTML=renderBond(b);
  var cfg=TV_CONFIGS[b.logoKey];
  if(cfg) buildTVWidget("tv-"+idx, cfg);
  fetchNews(b,"newsPanel-"+idx);
}

var tabsEl=document.getElementById("bondTabs");
bonds.forEach(function(b,idx){
  var t=document.createElement("div");
  t.className="tab"+(idx===0?" active":"");
  t.textContent=b.shortName+" \u00b7 "+b.ticker;
  t.onclick=(function(i){return function(){selectBond(i);};})(idx);
  tabsEl.appendChild(t);
});
selectBond(0);
})();
</script>
</body>
</html>
